# Copiare in auth_config.yaml e personalizzare.
# Le password vanno salvate come hash bcrypt: generarli con
#   python generate_password_hash.py
# La chiave del cookie si imposta nel file .env (AUTH_COOKIE_KEY).

credentials:
  usernames:
    utente_admin:
      email: utente_admin@example.com
      name: Utente Admin
      password: "HASH_BCRYPT_DA_GENERARE"
    utente_manager:
